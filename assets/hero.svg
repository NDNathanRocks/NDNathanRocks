<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="ng" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat">
<stop offset="0" stop-color="#c6ff3d"/><stop offset=".33" stop-color="#38e1ff"/><stop offset=".66" stop-color="#a78bfa"/><stop offset="1" stop-color="#c6ff3d"/>
