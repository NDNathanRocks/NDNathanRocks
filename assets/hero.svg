<svg xmlns="http://www.w3.org/2000/svg" width="840" height="280" viewBox="0 0 840 280" role="img" aria-label="Hey, I'm Nathan. Software and AI engineer in Vancouver, BC. I build AI that shows its receipts. Open to work."><title>Hey, I'm Nathan. Software and AI engineer in Vancouver, BC. I build AI that shows its receipts. Open to work.</title><style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.sans{font-family:ui-sans-serif,-apple-system,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.blob{transform-box:fill-box;transform-origin:center}
.b1{animation:d1 14s ease-in-out infinite alternate}
.b2{animation:d2 18s ease-in-out infinite alternate}
.b3{animation:d3 11s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(160px,40px) scale(1.25)}}
@keyframes d2{to{transform:translate(-200px,-30px) scale(.85)}}
@keyframes d3{to{transform:translate(90px,-50px) scale(1.3)}}
.wave{transform-box:fill-box;transform-origin:70% 80%;animation:wv 2.6s ease-in-out infinite}
@keyframes wv{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
.ridge{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 4s ease-out .3s forwards}
.ridgefill{opacity:0;animation:fadein 2s ease-out 2.5s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pl 1.6s ease-out infinite}
@keyframes pl{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
.core{transform-box:fill-box;transform-origin:center;animation:cg 3s ease-in-out infinite}
@keyframes cg{50%{transform:scale(1.08)}}
.blink{animation:bk 1s steps(1) infinite}
@keyframes bk{50%{opacity:0}}
.rise{opacity:0;animation:ri .8s ease-out forwards}
@keyframes ri{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style><rect x="0.5" y="0.5" width="839" height="279" rx="20" fill="#0b0b12" stroke="#26263a"/><defs>
